<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BFC (Best Fried Chicken) - Bangladesh's largest local fast-food chain. Crispy fried chicken, burgers, rice items and sides. Order online, take away or dine-in."
    />
    <meta
      name="keywords"
      content="BFC, Chicken, Fried Chicken, Chicken fry, Online Order, Online Ordering, Online Delivery, Take Away, Offer, Dine-in"
    />
    <meta name="theme-color" content="#c20d00" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=Pacifico&family=Raleway:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BFC (Best Fried Chicken)</title>
  </head>
  <body>
    <!-- Netlify Forms: lets Netlify detect the order form (the real one is submitted from React) -->
    <form name="order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="order" />
      <input name="bot-field" />
      <input name="orderId" />
      <input name="orderType" />
      <input name="name" />
      <input name="phone" />
      <input name="area" />
      <input name="address" />
      <textarea name="note"></textarea>
      <textarea name="items"></textarea>
      <input name="subtotal" />
      <input name="delivery" />
      <input name="total" />
      <input name="hasFromItems" />
      <input name="placedAt" />
    </form>
    <!-- Netlify Forms: table booking form (Dine-in) -->
    <form name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking" />
      <input name="bot-field" />
      <input name="bookingId" />
      <input name="name" />
      <input name="phone" />
      <input name="area" />
      <input name="date" />
      <input name="time" />
      <input name="guests" />
      <textarea name="items"></textarea>
      <input name="subtotal" />
      <input name="hasFromItems" />
      <textarea name="note"></textarea>
      <input name="placedAt" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
